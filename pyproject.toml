[project]
name = "scamshield-ai"
version = "0.1.0"
description = "ScamShield AI 2.0 - India-focused, offline-first scam investigation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116",
    "uvicorn>=0.35",
    "pydantic>=2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
